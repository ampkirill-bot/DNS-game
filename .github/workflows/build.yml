name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DksObhod.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DksObhod-debug.apk
          { printf '<!doctype html>\n<html lang="ru"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n</head><body>\n'
            cat web/obhod.html
            printf '\n</body></html>\n'; } > out/DksObhod-iPhone.html

      - uses: actions/upload-artifact@v4
        with:
          name: DksObhod-apk
          path: out/*

      # Последняя сборка выкладывается в Releases — APK удобно скачать прямо с телефона.
      - name: Publish to release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            out/DksObhod.apk
            out/DksObhod-iPhone.html
          body: |
            Сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
            Android: скачайте DksObhod.apk и установите.
            iPhone / браузер: DksObhod-iPhone.html — веб-версия одним файлом.

      - name: Check iPhone web page (GitHub Pages)
        continue-on-error: true
        run: |
          for u in https://ampkirill-bot.github.io/DNS-game/ https://ampkirill-bot.github.io/DNS-game/sw.js; do
            echo "== $u"; curl -sL -w '\nHTTP %{http_code}\n' "$u" | grep -E '<title>|const CACHE|<h1|HTTP ' | head -5
          done
