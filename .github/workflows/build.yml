name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DksObhod.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/DksObhod-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DksObhod-apk
          path: out/*.apk

      # Последняя сборка выкладывается в Releases — APK удобно скачать прямо с телефона.
      - name: Publish to release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: out/DksObhod.apk
          body: |
            Сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
            Скачайте DksObhod.apk на телефон и установите.
