<title>Обход ДКС</title>

<style>
/* Layout: one-column field tool — sticky steel header, white instrument cards, fixed save bar at the thumb. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e3e9f0;
  --fg: #16212c;
  --muted: #5b6b7b;
  --line: #cfd8e2;
  --steel: #1f4e79;
  --steel-fg: #ffffff;
  --steel-soft: #d6e4f2;
  --ink: #1f4e79;
  --amber: #f5a623;
  --amber-soft: #ffeccc;
  --amber-fg: #4a3200;
  --bad: #d32f2f;
  --bad-soft: #fde4e2;
  --ok: #2e7d32;
  --ok-soft: #dff1df;
  --shadow: 0 1px 2px rgba(22, 33, 44, .08), 0 2px 8px rgba(22, 33, 44, .06);
  --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #18212b; --surface-2: #223040; --fg: #e6edf4; --muted: #94a4b4; --line: #2e3d4d;
    --steel: #2a6296; --steel-fg: #ffffff; --steel-soft: #1d3550; --ink: #b9d4ee;
    --amber: #ffc25c; --amber-soft: #4a3713; --amber-fg: #ffe2ad;
    --bad: #ff6b61; --bad-soft: #4a1d1b; --ok: #6fcf74; --ok-soft: #173a1a;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212b; --surface-2: #223040; --fg: #e6edf4; --muted: #94a4b4; --line: #2e3d4d;
  --steel: #2a6296; --steel-fg: #ffffff; --steel-soft: #1d3550; --ink: #b9d4ee;
  --amber: #ffc25c; --amber-soft: #4a3713; --amber-fg: #ffe2ad;
  --bad: #ff6b61; --bad-soft: #4a1d1b; --ok: #6fcf74; --ok-soft: #173a1a;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-ui); font-size: 16px; line-height: 1.4; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--steel); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--steel); color: var(--steel-fg);
  padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px; min-height: 56px;
}
header.top h1 { font-size: 19px; margin: 0; font-weight: 700; text-wrap: balance; line-height: 1.2; }
header.top .sub { font-size: 12.5px; opacity: .85; }
header.top .grow { flex: 1; min-width: 0; }
.icon-btn { background: transparent; border: 0; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: inherit; flex: none; }
.icon-btn:active { background: rgba(255,255,255,.15); }
.hdr-btn { background: var(--amber); color: #2b1d00; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; display: flex; gap: 6px; align-items: center; flex: none; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }

.summary { background: var(--steel-soft); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.summary .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.summary .big b { font-size: 36px; line-height: 1; }
.bar { height: 8px; border-radius: 4px; background: var(--surface); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; font-weight: 600; font-size: 14px; }
.stats .hot { color: var(--bad); }

.plant-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
.plant-h h2 { margin: 0; font-size: 21px; }
.plant-h span { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 0; border-radius: var(--r); box-shadow: var(--shadow); text-align: left; padding: 12px 12px 12px 18px; position: relative; overflow: hidden; display: grid; gap: 5px; min-height: 96px; align-content: start; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--line); }
.tile.today::before { background: var(--ok); }
.tile.dev::before { background: var(--bad); }
.tile .t { display: flex; align-items: baseline; gap: 5px; }
.tile .t small { color: var(--muted); font-weight: 600; font-size: 13px; }
.tile .t b { font-size: 27px; line-height: 1; color: var(--ink); }
.tile .when { font-size: 13px; color: var(--muted); }
.tile.today .when { color: var(--ok); font-weight: 700; }
.tile .rm { font-size: 13px; font-weight: 700; display: flex; gap: 5px; align-items: center; }
.tile .rm::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }

.badge { display: inline-flex; align-items: center; gap: 4px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; width: fit-content; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.card-h .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--steel-soft); color: var(--ink); display: grid; place-items: center; flex: none; }
.card-h .ico svg.i { width: 19px; height: 19px; }
.hint { font-size: 13px; color: var(--muted); }
.hint.bad { color: var(--bad); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; }

.nf { display: grid; gap: 4px; min-width: 0; }
.nf label { font-size: 13px; color: var(--muted); font-weight: 600; }
.nf-row { display: flex; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.nf-row:focus-within { border-color: var(--steel); }
.nf input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 11px 10px; font-family: var(--font-num); font-size: 19px; font-weight: 600; color: var(--fg); outline: none; }
.nf .sign { border: 0; border-left: 1.5px solid var(--line); background: var(--surface-2); width: 46px; font-size: 22px; font-weight: 700; color: var(--ink); }
.nf .err { display: none; font-size: 12px; font-weight: 700; color: var(--bad); letter-spacing: .04em; }
.nf.dev .nf-row { border-color: var(--bad); background: var(--bad-soft); }
.nf.dev .err { display: block; }
.diff { background: var(--amber-soft); color: var(--amber-fg); border-radius: 10px; padding: 7px 10px; min-height: 50px; }
.diff small { display: block; font-size: 12px; font-weight: 600; }
.diff b { font-size: 21px; }

textarea, .txt { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); padding: 10px; font: inherit; resize: vertical; }
textarea:focus, .txt:focus { border-color: var(--steel); outline: none; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); box-shadow: 0 -2px 12px rgba(0,0,0,.12);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.savebar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.btn { border: 0; border-radius: 12px; padding: 14px 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--steel); color: var(--steel-fg); flex: 1; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.tonal { background: var(--steel-soft); color: var(--fg); flex: 1; }
.btn.danger { background: var(--bad); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.edit-banner { background: var(--amber-soft); color: var(--amber-fg); border-radius: var(--r); padding: 12px 14px; font-weight: 600; }
.sec-title { font-size: 18px; font-weight: 700; margin: 8px 0 0; }
.rec { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 6px 12px 14px; display: grid; gap: 6px; }
.rec.devc { background: var(--bad-soft); }
.rec.editing { outline: 2px solid var(--steel); }
.rec-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rec-h b { font-size: 15px; }
.rec-h .sp { flex: 1; }
.rec-h .icon-btn { color: var(--muted); width: 38px; height: 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); padding: 3px 8px; border-radius: 6px; font-size: 14px; }
.chip.bad { background: var(--bad); color: #fff; font-weight: 700; }
.kv { font-size: 14.5px; }
.kv span { color: var(--muted); }

.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img, .pgrid img { border-radius: 8px; object-fit: cover; background: var(--surface-2); display: block; cursor: pointer; }
.thumbs img { width: 72px; height: 72px; flex: none; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.pgrid figure { margin: 0; display: grid; gap: 3px; min-width: 0; }
.pgrid img { width: 100%; aspect-ratio: 1; max-width: 100%; }
.pgrid figcaption { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

.remark { background: var(--amber-soft); border: 0; border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; text-align: left; color: var(--fg); box-shadow: var(--shadow); }
.remark.done { background: var(--surface); }
.remark .rh { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.remark .st { margin-left: auto; font-weight: 700; color: var(--bad); }
.remark.done .st { color: var(--ok); }
.remark p { margin: 0; font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.check input { width: 24px; height: 24px; accent-color: var(--ok); }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--amber); color: #2b1d00; border: 0; border-radius: 16px; padding: 15px 20px; font-weight: 700; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

.overlay { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; }
.overlay .ob { display: flex; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); color: #fff; }
.overlay .img { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; touch-action: pinch-zoom; }
.overlay .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.overlay .cap { padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: #111; }
.overlay .cap input { width: 100%; background: #222; color: #fff; border: 1px solid #444; border-radius: 10px; padding: 10px; font: inherit; }
.modal-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; max-width: 360px; width: 100%; display: grid; gap: 16px; }
.modal p { margin: 0; font-size: 17px; }
.modal .row { justify-content: flex-end; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: 600; max-width: calc(100% - 32px); }
.a2hs { background: var(--amber-soft); color: var(--amber-fg); border-radius: 10px; padding: 8px 6px 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.a2hs span { flex: 1; min-width: 0; }
.a2hs .icon-btn { width: 34px; height: 34px; }
.warn { background: var(--bad-soft); color: var(--fg); border-radius: var(--r); padding: 12px; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .tile, .btn, .remark { transition: transform .08s; } .tile:active, .btn:active, .remark:active { transform: scale(.98); } }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 .diff { grid-column: span 2; } }
</style>

<div id="app"></div>

<script>
(() => {
"use strict";
// ---------- Справочник ГПА ----------
const PLANTS = [{ id: "V", title: "Валанжин", n: 12, cyl: true }, { id: "S", title: "Сеноман", n: 3, cyl: false }];
const GPAS = PLANTS.flatMap(p => Array.from({ length: p.n }, (_, i) => ({ id: p.id + (i + 1), plant: p, num: i + 1 })));
const gpaById = id => GPAS.find(g => g.id === id);
const LIMIT = 2.8;

// ---------- Иконки ----------
const I = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  box: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  fire: '<path d="M12 22c4 0 7-3 7-7 0-5-4-7-5-11-2 3-1 5-3 6-1-2-1-3-2-4-2 3-4 6-4 9 0 4 3 7 7 7z"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  gauge: '<path d="M12 14l4-4"/><path d="M3.5 18a9 9 0 1 1 17 0"/>',
  note: '<path d="M4 4h16v12l-4 4H4z"/><path d="M8 9h8M8 13h5"/>',
  save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7M8 21v-7h8v7"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  cam: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
};
const ic = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

// ---------- Числа и даты ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const SIGNED = /^-?\d{0,5}(,\d{0,3})?$/, UNSIGNED = /^\d{0,5}(,\d{0,3})?$/;
const parseNum = s => { const t = String(s ?? "").replace(",", "."); if (!t || t === "-" || t === "." || t === "-.") return null; const v = Number(t); return isFinite(v) ? v : null; };
const fmt = v => { if (v == null) return ""; let s = (Math.round(v * 1000) / 1000).toString(); if (s === "-0") s = "0"; return s.replace(".", ","); };
const dash = v => v == null ? "—" : fmt(v);
const isDev = v => v != null && Math.abs(v) > LIMIT + 1e-9;
const pad = n => String(n).padStart(2, "0");
const dt = ts => { const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dShort = ts => { const d = new Date(ts); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${hm(ts)}`; };
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- Хранилище (IndexedDB, запасной вариант — память) ----------
let S = { readings: [], hangarPhotos: [], hangarNotes: {}, remarks: [] };
let dbp = null, storageOk = true;
const memPhotos = new Map();
function idb() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open("dks-obhod", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("photos"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  return dbp;
}
async function tx(store, mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const st = t.objectStore(store);
    const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
  });
}
async function loadState() {
  try { const v = await tx("kv", "readonly", st => st.get("state")); if (v) S = Object.assign(S, v); }
  catch (e) { storageOk = false; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => { try { await tx("kv", "readwrite", st => st.put(S, "state")); } catch (e) { storageOk = false; } }, 150);
}
async function putPhoto(id, blob) { try { await tx("photos", "readwrite", st => st.put(blob, id)); } catch (e) { memPhotos.set(id, blob); } }
async function getPhoto(id) { if (memPhotos.has(id)) return memPhotos.get(id); try { return await tx("photos", "readonly", st => st.get(id)); } catch (e) { return null; } }
async function delPhoto(id) { memPhotos.delete(id); revoke(id); try { await tx("photos", "readwrite", st => st.delete(id)); } catch (e) {} }
const urlCache = new Map();
function revoke(id) { const u = urlCache.get(id); if (u) { URL.revokeObjectURL(u); urlCache.delete(id); } }
async function photoURL(id) { if (urlCache.has(id)) return urlCache.get(id); const b = await getPhoto(id); if (!b) return ""; const u = URL.createObjectURL(b); urlCache.set(id, u); return u; }
function hydrate(root = document) { root.querySelectorAll("img[data-photo]").forEach(async img => { const u = await photoURL(img.dataset.photo); if (u) img.src = u; }); }

// Сжатие фото до 1600 px
function shrink(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => resolve(b || file), "image/jpeg", 0.82);
    };
    im.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    im.src = url;
  });
}
async function addFiles(files) {
  const ids = [];
  for (const f of files) { if (!f.type.startsWith("image/")) continue; const id = "p" + uid(); await putPhoto(id, await shrink(f)); ids.push(id); }
  return ids;
}

// ---------- Состояние интерфейса ----------
const EMPTY_FORM = () => ({ c: ["", "", "", "", ""], mskOil: "", mskDiff: "", engOil: "", pB: "", pA: "", note: "" });
let view = { name: "home" };
let form = EMPTY_FORM(), editingId = null, formGpa = null;
let remarkDraft = null;
const app = document.getElementById("app");

const formDirty = () => form.c.some(Boolean) || ["mskOil", "mskDiff", "engOil", "pB", "pA", "note"].some(k => String(form[k]).trim());
const latestFor = id => S.readings.filter(r => r.gpaId === id).sort((a, b) => b.ts - a.ts)[0];
const rDev = r => r && r.c && r.c.some(isDev);
const openRemarks = id => S.remarks.filter(r => r.gpaId === id && !r.resolved).length;

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status"); document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
function confirmBox(text, okText, onOk) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row"><button class="btn ghost" data-k="no">Отмена</button><button class="btn danger" data-k="ok">${esc(okText)}</button></div></div>`;
  bg.addEventListener("click", e => { const k = e.target.closest("[data-k]")?.dataset.k; if (k || e.target === bg) { bg.remove(); if (k === "ok") onOk(); } });
  document.body.appendChild(bg); bg.querySelector('[data-k="ok"]').focus();
}
function go(v) { view = v; render(); window.scrollTo(0, 0); }

// Подсказка «На экран Домой»: только iPhone/iPad в обычном Safari, не в уже установленном приложении.
function showA2hs() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  let hidden = false; try { hidden = localStorage.getItem("a2hs-hidden") === "1"; } catch (e) {}
  return ios && !standalone && !hidden;
}

// ---------- Экран: главная ----------
function renderHome() {
  const done = GPAS.filter(g => { const l = latestFor(g.id); return l && isToday(l.ts); }).length;
  const devs = GPAS.filter(g => rDev(latestFor(g.id))).length;
  const rms = S.remarks.filter(r => !r.resolved).length;
  const day = new Date().toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" });
  let h = `<header class="top"><div class="grow"><h1>Обход ДКС</h1><div class="sub">${esc(day[0].toUpperCase() + day.slice(1))}</div></div></header><main>`;
  if (showA2hs()) h += `<div class="a2hs"><span>Чтобы работало без интернета: «Поделиться» → «На экран „Домой“»</span><button class="icon-btn" data-act="a2hs-close" aria-label="Скрыть">${ic("x")}</button></div>`;
  if (!storageOk) h += `<div class="warn">Браузер не даёт сохранять данные (возможно, включён частный режим). Записи пропадут после закрытия страницы.</div>`;
  h += `<section class="summary" aria-label="Итог за сегодня"><div class="big"><b class="num">${done}</b><span>из ${GPAS.length} ГПА записано сегодня</span></div>
    <div class="bar"><i style="width:${(done / GPAS.length * 100).toFixed(1)}%"></i></div>
    <div class="stats"><span class="${devs ? "hot" : ""}">Отклонений: ${devs}</span><span>Открытых замечаний: ${rms}</span></div></section>`;
  for (const p of PLANTS) {
    const list = GPAS.filter(g => g.plant === p);
    const pd = list.filter(g => { const l = latestFor(g.id); return l && isToday(l.ts); }).length;
    h += `<div class="plant-h"><h2>${p.title}</h2><span>сегодня ${pd} / ${list.length}</span></div><div class="tiles">`;
    for (const g of list) {
      const l = latestFor(g.id), today = l && isToday(l.ts), dev = rDev(l), rm = openRemarks(g.id);
      h += `<button class="tile ${today ? "today" : ""} ${dev ? "dev" : ""}" data-act="open" data-id="${g.id}">
        <span class="t"><small>ГПА</small><b class="num">${g.num}</b></span>
        <span class="when">${!l ? "нет записей" : today ? "сегодня " + hm(l.ts) : dShort(l.ts)}</span>
        ${dev ? `<span class="badge">ОТКЛОНЕНИЕ</span>` : ""}${rm ? `<span class="rm">Замечаний: ${rm}</span>` : ""}</button>`;
    }
    h += `</div>`;
  }
  h += `<p class="hint">Данные хранятся только в этом браузере на этом телефоне.</p></main>`;
  app.innerHTML = h;
}

// ---------- Экран: ГПА ----------
function nf(key, label, { neg = false, auto = false, idx = null } = {}) {
  const val = idx == null ? form[key] : form.c[idx];
  const dev = idx != null && isDev(parseNum(val));
  const fid = idx == null ? key : "c" + idx;
  return `<div class="nf ${dev ? "dev" : ""}" data-wrap="${fid}"><label for="f-${fid}">${label}</label>
    <div class="nf-row"><input id="f-${fid}" class="num" inputmode="decimal" autocomplete="off" enterkeyhint="next" data-num="${fid}" data-neg="${neg ? 1 : 0}" data-auto="${auto ? 1 : 0}" value="${esc(val)}">
    ${neg ? `<button type="button" class="sign" data-act="sign" data-f="${fid}" aria-label="Сменить знак">±</button>` : ""}</div>
    <span class="err">ОТКЛОНЕНИЕ</span></div>`;
}
const getF = fid => fid[0] === "c" && fid.length === 2 ? form.c[+fid[1]] : form[fid];
const setF = (fid, v) => { if (fid[0] === "c" && fid.length === 2) form.c[+fid[1]] = v; else form[fid] = v; };
const diffVal = () => { const a = parseNum(form.pA), b = parseNum(form.pB); return a != null && b != null ? b - a : null; };

function renderGpa() {
  const g = gpaById(view.id), tab = view.tab || "r";
  if (formGpa !== g.id) { form = EMPTY_FORM(); editingId = null; formGpa = g.id; }
  const rms = S.remarks.filter(r => r.gpaId === g.id).sort((a, b) => (a.resolved - b.resolved) || b.ts - a.ts);
  const open = rms.filter(r => !r.resolved).length;
  let h = `<header class="top"><button class="icon-btn" data-act="back" aria-label="Назад">${ic("back")}</button>
    <div class="grow"><h1>ГПА-${g.num}</h1><div class="sub">${g.plant.title}</div></div>
    <button class="hdr-btn" data-act="hangar">${ic("box")}Ангар</button></header><main>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === "r"}" data-act="tab" data-t="r">Показания</button>
    <button role="tab" aria-selected="${tab === "m"}" data-act="tab" data-t="m">Замечания${open ? ` (${open})` : ""}</button></div>`;
  if (tab === "r") {
    if (editingId) { const r = S.readings.find(x => x.id === editingId); h += `<div class="edit-banner">Редактирование записи от ${dt(r.ts)}</div>`; }
    if (g.plant.cyl) {
      const bad = form.c.map((v, i) => isDev(parseNum(v)) ? i + 1 : 0).filter(Boolean);
      h += `<section class="card"><div class="card-h"><span class="ico">${ic("fire")}</span>Пожарные баллоны</div>
        <div class="hint ${bad.length ? "bad" : ""}" id="cyl-hint">${bad.length ? "Отклонение: баллон " + bad.map(n => "№" + n).join(", ") : "Норма: от −2,8 до 2,8"}</div>
        <div class="grid2">${[0, 1, 2, 3, 4].map(i => nf(null, "Баллон " + (i + 1), { neg: true, auto: true, idx: i })).join("")}</div></section>`;
    }
    const d = diffVal();
    h += `<section class="card"><div class="card-h"><span class="ico">${ic("drop")}</span>Компрессор (МСК)</div>
      <div class="grid2">${nf("mskOil", "Уровень масла")}${nf("mskDiff", "Перепад на фильтрах", { neg: true })}</div></section>
      <section class="card"><div class="card-h"><span class="ico">${ic("gauge")}</span>Двигатель</div>
      ${nf("engOil", "Уровень в маслобаке двигателя")}
      <div class="hint">Давление на фильтрах</div>
      <div class="grid3">${nf("pB", "До")}${nf("pA", "После")}<div class="diff"><small>Перепад</small><b class="num" id="diff">${d == null ? "—" : fmt(d)}</b></div></div></section>
      <section class="card"><div class="card-h"><span class="ico">${ic("note")}</span>Примечание</div>
      <textarea id="f-note" rows="2" data-txt="note" placeholder="Необязательно">${esc(form.note)}</textarea></section>`;
    const list = S.readings.filter(r => r.gpaId === g.id).sort((a, b) => b.ts - a.ts);
    h += `<h3 class="sec-title">История записей</h3>`;
    if (!list.length) h += `<div class="empty">Записей пока нет</div>`;
    for (const r of list) {
      const dev = rDev(r), diff = r.pB != null && r.pA != null ? r.pB - r.pA : null;
      h += `<article class="rec ${dev ? "devc" : ""} ${r.id === editingId ? "editing" : ""}"><div class="rec-h"><b>${dt(r.ts)}</b>${dev ? `<span class="badge">ОТКЛОНЕНИЕ</span>` : ""}<span class="sp"></span>
        <button class="icon-btn" data-act="redit" data-id="${r.id}" aria-label="Изменить">${ic("edit")}</button>
        <button class="icon-btn" data-act="rdel" data-id="${r.id}" aria-label="Удалить">${ic("trash")}</button></div>
        ${g.plant.cyl ? `<div class="chips">${r.c.map((v, i) => `<span class="chip num ${isDev(v) ? "bad" : ""}">№${i + 1}: ${dash(v)}</span>`).join("")}</div>` : ""}
        <div class="kv"><span>МСК:</span> уровень <b class="num">${dash(r.mskOil)}</b>, перепад <b class="num">${dash(r.mskDiff)}</b></div>
        <div class="kv"><span>Двигатель:</span> уровень <b class="num">${dash(r.engOil)}</b></div>
        <div class="kv"><span>Фильтры:</span> до <b class="num">${dash(r.pB)}</b> / после <b class="num">${dash(r.pA)}</b> → перепад <b class="num">${dash(diff)}</b></div>
        ${r.note ? `<div class="kv"><span>Примечание:</span> ${esc(r.note)}</div>` : ""}</article>`;
    }
    h += `</main><div class="savebar"><div class="in">${editingId || formDirty() ? `<button class="btn ghost" data-act="clear">${editingId ? "Отмена" : "Очистить"}</button>` : ""}
      <button class="btn primary" data-act="save">${ic("save")}${editingId ? "Сохранить изменения" : "Сохранить запись"}</button></div></div>`;
  } else {
    if (!rms.length) h += `<div class="empty">Замечаний нет. Нажмите «Замечание», чтобы добавить.</div>`;
    for (const r of rms) {
      h += `<button class="remark ${r.resolved ? "done" : ""}" data-act="remark" data-id="${r.id}"><span class="rh">${dt(r.ts)}<span class="st">${r.resolved ? "Устранено" : "Открыто"}</span></span>
        <p>${esc(r.text) || "(без описания)"}</p>${r.photos.length ? `<span class="thumbs">${r.photos.map(p => `<img alt="" data-photo="${p}">`).join("")}</span>` : ""}</button>`;
    }
    h += `</main><button class="fab" data-act="remark" data-id="">${ic("plus")}Замечание</button>`;
  }
  app.innerHTML = h;
  hydrate();
}

function saveReading() {
  const g = gpaById(view.id);
  const c = g.plant.cyl ? form.c.map(parseNum) : [null, null, null, null, null];
  const r = { c, mskOil: parseNum(form.mskOil), mskDiff: parseNum(form.mskDiff), engOil: parseNum(form.engOil), pB: parseNum(form.pB), pA: parseNum(form.pA), note: form.note.trim() };
  const any = c.some(v => v != null) || [r.mskOil, r.mskDiff, r.engOil, r.pB, r.pA].some(v => v != null) || r.note;
  if (!any) { toast("Нет данных для сохранения"); return; }
  if (editingId) { const old = S.readings.find(x => x.id === editingId); Object.assign(old, r); toast("Запись обновлена"); }
  else { S.readings.push({ id: uid(), gpaId: g.id, ts: Date.now(), ...r }); toast("Сохранено"); }
  persist(); form = EMPTY_FORM(); editingId = null; render(); window.scrollTo(0, 0);
}

// ---------- Экран: ангар ----------
function renderHangar() {
  const g = gpaById(view.id);
  const ph = S.hangarPhotos.filter(p => p.gpaId === g.id).sort((a, b) => b.ts - a.ts);
  app.innerHTML = `<header class="top"><button class="icon-btn" data-act="back" aria-label="Назад">${ic("back")}</button>
    <div class="grow"><h1>Ангар · ГПА-${g.num}</h1><div class="sub">${g.plant.title}</div></div></header><main>
    <section class="card"><div class="card-h"><span class="ico">${ic("note")}</span>Что лежит в ангаре</div>
    <textarea id="hangar-note" rows="4" data-hnote="1" placeholder="Например: 2 фильтра МСК, ветошь, ключи…">${esc(S.hangarNotes[g.id] || "")}</textarea>
    <span class="hint">Сохраняется автоматически</span></section>
    <div class="row">${photoButtons("hangar")}</div>
    <h3 class="sec-title">${ph.length ? "Фото: " + ph.length : "Фото пока нет"}</h3>
    <div class="pgrid">${ph.map(p => `<figure><img alt="${esc(p.caption)}" data-photo="${p.photo}" data-act="hview" data-id="${p.id}"><figcaption>${esc(p.caption || dShort(p.ts))}</figcaption></figure>`).join("")}</div></main>`;
  hydrate();
}
function photoButtons(target) {
  return `<label class="btn tonal filebtn">${ic("cam")}Фото<input type="file" accept="image/*" capture="environment" data-files="${target}"></label>
    <label class="btn ghost filebtn" style="flex:1">${ic("img")}Галерея<input type="file" accept="image/*" multiple data-files="${target}"></label>`;
}

// ---------- Экран: замечание ----------
function renderRemark() {
  const g = gpaById(view.id), d = remarkDraft;
  app.innerHTML = `<header class="top"><button class="icon-btn" data-act="back" aria-label="Назад">${ic("back")}</button>
    <div class="grow"><h1>${d.id ? "Замечание" : "Новое замечание"}</h1><div class="sub">${g.plant.title} · ГПА-${g.num} · ${dt(d.ts)}</div></div>
    ${d.id ? `<button class="icon-btn" data-act="rmdel" aria-label="Удалить">${ic("trash")}</button>` : ""}</header><main>
    <section class="card"><label class="hint" for="rm-text">Описание замечания</label>
    <textarea id="rm-text" rows="5" data-rmtext="1">${esc(d.text)}</textarea>
    <label class="check"><input type="checkbox" id="rm-res" data-rmres="1" ${d.resolved ? "checked" : ""}>Устранено</label></section>
    <div class="row">${photoButtons("remark")}</div>
    ${d.photos.length ? `<h3 class="sec-title">Фото: ${d.photos.length}</h3><div class="pgrid">${d.photos.map(p => `<figure><img alt="" data-photo="${p}" data-act="rmview" data-id="${p}"></figure>`).join("")}</div>` : ""}
    </main><div class="savebar"><div class="in"><button class="btn primary" data-act="rmsave">${ic("save")}Сохранить замечание</button></div></div>`;
  hydrate();
}
function openRemark(id) {
  const r = id ? S.remarks.find(x => x.id === id) : null;
  remarkDraft = r ? { ...r, photos: [...r.photos], added: [], removed: [] } : { id: null, gpaId: view.id, ts: Date.now(), text: "", resolved: false, photos: [], added: [], removed: [] };
  go({ name: "remark", id: view.id });
}
function remarkDirty() {
  const d = remarkDraft; if (!d) return false;
  if (d.added.length || d.removed.length) return true;
  const r = d.id && S.remarks.find(x => x.id === d.id);
  return r ? r.text !== d.text || r.resolved !== d.resolved : d.text.trim() !== "";
}
function leaveRemark() { remarkDraft.added.forEach(delPhoto); remarkDraft = null; go({ name: "gpa", id: view.id, tab: "m" }); }

// ---------- Просмотр фото ----------
function viewer(photoId, { onDelete, caption, onCaption } = {}) {
  const o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role", "dialog");
  o.innerHTML = `<div class="ob"><button class="icon-btn" data-k="close" aria-label="Закрыть">${ic("x")}</button>${onDelete ? `<button class="icon-btn" data-k="del" aria-label="Удалить">${ic("trash")}</button>` : ""}</div>
    <div class="img"><img alt="" data-photo="${photoId}"></div>${onCaption ? `<div class="cap"><input id="cap-input" placeholder="Подпись к фото" value="${esc(caption || "")}"></div>` : ""}`;
  const close = () => { if (onCaption) { const v = o.querySelector("#cap-input").value; if (v !== (caption || "")) onCaption(v); } o.remove(); };
  o.addEventListener("click", e => {
    const k = e.target.closest("[data-k]")?.dataset.k;
    if (k === "close") close();
    if (k === "del") confirmBox("Удалить это фото?", "Удалить", () => { o.remove(); onDelete(); });
  });
  document.body.appendChild(o); hydrate(o);
}

// ---------- Навигация назад ----------
function back() {
  if (view.name === "gpa") {
    if (formDirty()) confirmBox("Есть несохранённые показания. Выйти без сохранения?", "Выйти", () => { form = EMPTY_FORM(); editingId = null; go({ name: "home" }); });
    else go({ name: "home" });
  } else if (view.name === "hangar") go({ name: "gpa", id: view.id });
  else if (view.name === "remark") { if (remarkDirty()) confirmBox("Изменения не сохранены. Выйти без сохранения?", "Выйти", leaveRemark); else leaveRemark(); }
}

// ---------- События ----------
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "open": go({ name: "gpa", id }); break;
    case "a2hs-close": try { localStorage.setItem("a2hs-hidden", "1"); } catch (e) {} render(); break;
    case "back": back(); break;
    case "hangar": go({ name: "hangar", id: view.id }); break;
    case "tab": view.tab = el.dataset.t; render(); break;
    case "sign": {
      const f = el.dataset.f, v = getF(f); setF(f, v.startsWith("-") ? v.slice(1) : "-" + v);
      const inp = document.getElementById("f-" + f); inp.value = getF(f); refreshDerived(f); inp.focus();
      const L = inp.value.length; try { inp.setSelectionRange(L, L); } catch (_) {}
      break;
    }
    case "save": saveReading(); break;
    case "clear": form = EMPTY_FORM(); editingId = null; render(); break;
    case "redit": {
      const r = S.readings.find(x => x.id === id);
      form = { c: r.c.map(fmt), mskOil: fmt(r.mskOil), mskDiff: fmt(r.mskDiff), engOil: fmt(r.engOil), pB: fmt(r.pB), pA: fmt(r.pA), note: r.note || "" };
      editingId = id; render(); window.scrollTo(0, 0); break;
    }
    case "rdel": {
      const r = S.readings.find(x => x.id === id);
      confirmBox(`Удалить запись от ${dt(r.ts)}?`, "Удалить", () => { S.readings = S.readings.filter(x => x.id !== id); if (editingId === id) { editingId = null; form = EMPTY_FORM(); } persist(); render(); });
      break;
    }
    case "remark": openRemark(id || null); break;
    case "hview": {
      const p = S.hangarPhotos.find(x => x.id === id);
      viewer(p.photo, {
        caption: p.caption,
        onCaption: v => { p.caption = v; persist(); render(); },
        onDelete: () => { S.hangarPhotos = S.hangarPhotos.filter(x => x.id !== id); delPhoto(p.photo); persist(); render(); },
      });
      break;
    }
    case "rmview": viewer(id, { onDelete: () => {
      const d = remarkDraft; d.photos = d.photos.filter(x => x !== id);
      if (d.added.includes(id)) { d.added = d.added.filter(x => x !== id); delPhoto(id); } else d.removed.push(id);
      render();
    } }); break;
    case "rmsave": {
      const d = remarkDraft;
      if (!d.text.trim() && !d.photos.length) { toast("Добавьте описание или фото"); return; }
      const rec = { id: d.id || uid(), gpaId: d.gpaId, ts: d.ts, text: d.text.trim(), resolved: d.resolved, photos: d.photos };
      if (d.id) S.remarks = S.remarks.map(x => x.id === d.id ? rec : x); else S.remarks.push(rec);
      d.removed.forEach(delPhoto); persist(); remarkDraft = null; toast("Замечание сохранено");
      go({ name: "gpa", id: view.id, tab: "m" }); break;
    }
    case "rmdel": confirmBox("Удалить это замечание вместе с фото?", "Удалить", () => {
      const d = remarkDraft; [...d.photos, ...d.removed].forEach(delPhoto);
      S.remarks = S.remarks.filter(x => x.id !== d.id); persist(); remarkDraft = null; go({ name: "gpa", id: view.id, tab: "m" });
    }); break;
  }
});

function refreshDerived(fid) {
  const w = document.querySelector(`[data-wrap="${fid}"]`);
  if (fid[0] === "c" && fid.length === 2) {
    w.classList.toggle("dev", isDev(parseNum(getF(fid))));
    const bad = form.c.map((v, i) => isDev(parseNum(v)) ? i + 1 : 0).filter(Boolean), hint = document.getElementById("cyl-hint");
    if (hint) { hint.textContent = bad.length ? "Отклонение: баллон " + bad.map(n => "№" + n).join(", ") : "Норма: от −2,8 до 2,8"; hint.classList.toggle("bad", !!bad.length); }
  }
  if (fid === "pA" || fid === "pB") { const d = diffVal(); document.getElementById("diff").textContent = d == null ? "—" : fmt(d); }
  // Кнопка «Очистить» появляется после первого ввода
  const sb = document.querySelector(".savebar .in");
  if (sb && !editingId) {
    const has = !!sb.querySelector('[data-act="clear"]');
    if (formDirty() && !has) sb.insertAdjacentHTML("afterbegin", `<button class="btn ghost" data-act="clear">Очистить</button>`);
    if (!formDirty() && has) sb.querySelector('[data-act="clear"]').remove();
  }
}

let hnoteTimer = null;
app.addEventListener("input", async e => {
  const t = e.target;
  if (t.dataset.num) {
    const fid = t.dataset.num, prev = getF(fid);
    let v = t.value.replace(/\./g, ",").replace(/[\s−]/g, m => m === "−" ? "-" : "");
    const ok = (t.dataset.neg === "1" ? SIGNED : UNSIGNED).test(v);
    if (!ok) { t.value = prev; return; }
    if (t.dataset.auto === "1" && v.length > prev.length && /^-?\d$/.test(v)) v += ",";
    if (v !== t.value) { t.value = v; try { t.setSelectionRange(v.length, v.length); } catch (_) {} }
    setF(fid, v); refreshDerived(fid);
  } else if (t.dataset.txt) { form[t.dataset.txt] = t.value; refreshDerived("note"); }
  else if (t.dataset.hnote) {
    S.hangarNotes[view.id] = t.value; clearTimeout(hnoteTimer); hnoteTimer = setTimeout(persist, 400);
  } else if (t.dataset.rmtext) remarkDraft.text = t.value;
});
app.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.rmres) { remarkDraft.resolved = t.checked; return; }
  if (t.dataset.files) {
    const files = [...(t.files || [])]; t.value = ""; if (!files.length) return;
    toast("Сохраняю фото…");
    const ids = await addFiles(files);
    if (t.dataset.files === "hangar") {
      const now = Date.now(); ids.forEach((p, i) => S.hangarPhotos.push({ id: uid(), gpaId: view.id, ts: now + i, caption: "", photo: p })); persist();
    } else if (remarkDraft) { remarkDraft.photos.push(...ids); remarkDraft.added.push(...ids); }
    render();
  }
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.num) {
    e.preventDefault(); const all = [...app.querySelectorAll("input[data-num]")]; const i = all.indexOf(e.target);
    if (all[i + 1]) all[i + 1].focus(); else e.target.blur();
  }
});

function render() {
  if (view.name === "home") renderHome();
  else if (view.name === "gpa") renderGpa();
  else if (view.name === "hangar") renderHangar();
  else if (view.name === "remark") renderRemark();
}

loadState().then(render);
render();
})();
</script>
